name: check

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - "*"
    schedule:
        - cron: "0 0 * * 0"

jobs:
    test-python-coverage:
        uses: ./.github/workflows/.hatch-run.yml
        with:
            job-name: "python-{0}"
            # Retries needed because GitHub workers sometimes lag enough to crash parallel workers
            run-cmd: "hatch test --parallel --cover --retries 10"
    lint-python:
        uses: ./.github/workflows/.hatch-run.yml
        with:
            job-name: "python-{0}"
            run-cmd: "hatch fmt src/reactpy --check && hatch run python:type_check"
    test-python:
        uses: ./.github/workflows/.hatch-run.yml
        with:
            job-name: "python-{0} {1}"
            run-cmd: "hatch test --parallel --retries 10"
            runs-on: '["ubuntu-latest", "macos-latest", "windows-latest"]'
            python-version: '["3.11", "3.12", "3.13", "3.14"]'
    test-docs:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - uses: actions/setup-python@v5
              with:
                  python-version: 3.x
            - name: Install Python Dependencies
              run: pip install --upgrade pip hatch uv
            - name: Check documentation links
              run: hatch run docs:linkcheck
            - name: Check docs build
              run: hatch run docs:build
            - name: Check docs examples
              run: hatch run docs:check
    test-javascript:
        uses: ./.github/workflows/.hatch-run.yml
        with:
            job-name: "{1}"
            run-cmd: "hatch run javascript:test"
    lint-javascript:
        uses: ./.github/workflows/.hatch-run.yml
        with:
            job-name: "{1}"
            run-cmd: "hatch run javascript:check"

